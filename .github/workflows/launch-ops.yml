name: Launch ops

# Gate 4 launch steps (docs/autofix/LAUNCH.md) with the repository's own secrets and variables:
# scripts/ci/launch-ops.mjs. Run by hand (Actions > Launch ops > Run workflow). "report" only reads;
# every other task changes something only when "apply" is ticked. Logs show names, statuses, hosts and
# public DNS records, never a secret value.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        default: report
        options:
          - report
          - vercel-domains
          - vercel-secrets
          - twilio-webhooks
          - twilio-number
          - resend-domain
          - supabase-migrate
          - supabase-auth
          - stripe-setup
      apply:
        description: Make the changes (otherwise only report what would change)
        type: boolean
        default: false
      number:
        description: "twilio-number: the number, E.164 (e.g. +441146974393)"
        type: string
        default: ""
      garage:
        description: "twilio-number: the garage's slug (e.g. doncaster-auto)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: launch-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","autofix"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ${{ inputs.task }}${{ inputs.apply && ' (apply)' || ' (report only)' }}
        run: node scripts/ci/launch-ops.mjs
        env:
          LAUNCH_TASK: ${{ inputs.task }}
          LAUNCH_APPLY: ${{ inputs.apply }}
          LAUNCH_NUMBER: ${{ inputs.number }}
          LAUNCH_GARAGE: ${{ inputs.garage }}
          # Vercel
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          NEXT_PUBLIC_ADMIN_HOST: ${{ vars.NEXT_PUBLIC_ADMIN_HOST }}
          NEXT_PUBLIC_TENANT_ROOT_DOMAIN: ${{ vars.NEXT_PUBLIC_TENANT_ROOT_DOMAIN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Twilio
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          # Resend and Cloudflare DNS (zone vitalos.co.uk)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Full-access key for managing domains (the app's RESEND_API_KEY may be send-only)
          RESEND_ADMIN_API_KEY: ${{ secrets.RESEND_ADMIN_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          # Supabase (Management API token: Supabase > Account > Access Tokens)
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Stripe, test mode only (the task refuses a live key). Prices default to 4500 and 1500 pence.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PLAN_PRO_PRICE_PENCE: ${{ vars.PLAN_PRO_PRICE_PENCE }}
          PLAN_EXTRA_SITE_PRICE_PENCE: ${{ vars.PLAN_EXTRA_SITE_PRICE_PENCE }}
