name: Super Admin

# The Django super admin in superadmin/ (P5.1, DECISIONS D16). Mirrors vitalos-platform's
# .github/workflows/superadmin.yml: lint, tests on PostgreSQL 17, deploy checks, pip-audit and bandit,
# then the integration tests against a local Supabase as autofix_superadmin, the production image,
# its release job (twice), and the Playwright smoke test against the running container.
on:
  pull_request:
    paths:
      - "superadmin/**"
      - "!superadmin/**.md"
      - "!superadmin/docs/**"
      - "supabase/migrations/**"
      - ".github/workflows/superadmin.yml"
  push:
    branches: [main]
    paths:
      - "superadmin/**"
      - "!superadmin/**.md"
      - "!superadmin/docs/**"
      - "supabase/migrations/**"
      - ".github/workflows/superadmin.yml"

permissions:
  contents: read

concurrency:
  group: superadmin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: superadmin

jobs:
  checks:
    name: Lint, tests, deploy checks, pip-audit and bandit
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","autofix"]') }}
    # Never run code from forks on the self-hosted VM.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - run: python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Start PostgreSQL 17 for this runner
        run: |
          [[ "${RUNNER_NAME:-}" =~ ([0-9]+)$ ]] && slot=$((10#${BASH_REMATCH[1]})) || slot=0
          port=$((55400 + slot))
          name="superadmin-pg-${slot}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" -p "127.0.0.1:${port}:5432" -e POSTGRES_PASSWORD=postgres postgres:17
          for _ in $(seq 1 30); do docker exec "$name" pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          echo "PG_NAME=$name" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:${port}/superadmin" >> "$GITHUB_ENV"
          echo "AUTOFIX_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:${port}/autofix" >> "$GITHUB_ENV"
      - name: pytest (PostgreSQL 17, both aliases)
        run: pytest
      - name: manage.py check --deploy
        env:
          DATABASE_URL: postgres://u@localhost:5432/db
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: superadmin.autofix.vitalos.co.uk
          CSRF_TRUSTED_ORIGINS: https://superadmin.autofix.vitalos.co.uk
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export DJANGO_SECRET_KEY
          python manage.py check --deploy --fail-level WARNING
      - name: pip-audit (runtime dependencies)
        run: pip-audit --strict -r requirements.txt
      - name: bandit
        run: bandit -r apps config -c pyproject.toml
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f "${PG_NAME:-none}" >/dev/null 2>&1 || true

  integration:
    name: Supabase role, container and browser smoke test
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","autofix"]') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: superadmin/requirements*.txt
      - run: python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Give this runner its own Supabase project and ports
        run: bash scripts/ci/supabase-isolate.sh
        working-directory: .
      - name: Clear a stack left behind by a cancelled job on this runner
        run: supabase stop --no-backup || true
        working-directory: .
      - name: Start isolated local Supabase
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,realtime,postgres-meta
        working-directory: .
      - name: Rebuild local database from migrations
        run: supabase db reset --local --no-seed
        working-directory: .
      - name: Seed demo data and give the super admin role a throwaway local password
        working-directory: .
        run: |
          bash scripts/ci/supabase-env.sh
          set -a; . "$GITHUB_ENV"; set +a
          pnpm db:seed
          role_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$role_password"
          docker exec "supabase_db_${SUPABASE_PROJECT_ID}" psql -U postgres -qc \
            "alter role autofix_superadmin with login password '${role_password}'"
          {
            echo "AUTOFIX_LIVE_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${SUPABASE_DB_PORT}/postgres"
            echo "AUTOFIX_LIVE_DATABASE_URL=postgres://autofix_superadmin:${role_password}@127.0.0.1:${SUPABASE_DB_PORT}/postgres"
          } >> "$GITHUB_ENV"
      - name: Integration tests as autofix_superadmin
        run: pytest -m integration
      - name: Build the production image
        run: docker build -t "autofix-superadmin:ci-${{ github.run_id }}" .
      - name: Run the release job twice and start the production image
        run: |
          [[ "${RUNNER_NAME:-}" =~ ([0-9]+)$ ]] && slot=$((10#${BASH_REMATCH[1]})) || slot=0
          pg_port=$((55500 + slot)); app_port=$((3400 + slot * 10 + 5))
          docker rm -f "superadmin-ci-pg-${slot}" "superadmin-ci-web-${slot}" >/dev/null 2>&1 || true
          docker run -d --name "superadmin-ci-pg-${slot}" -p "127.0.0.1:${pg_port}:5432" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=superadmin postgres:17
          for _ in $(seq 1 30); do docker exec "superadmin-ci-pg-${slot}" pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          umask 077
          status_token="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          admin_password="$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$status_token"
          echo "::add-mask::$admin_password"
          {
            echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
            echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:${pg_port}/superadmin"
            echo "AUTOFIX_DATABASE_URL=${AUTOFIX_LIVE_DATABASE_URL}?sslmode=disable"
            echo "AUTOFIX_STATUS_TOKEN=${status_token}"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "CSRF_TRUSTED_ORIGINS=http://localhost:${app_port}"
            echo "SECURE_SSL_REDIRECT=False"
            echo "APP_ENVIRONMENT=staging"
            echo "PORT=${app_port}"
            echo "BOOTSTRAP_ADMIN_EMAIL=ci-admin@example.test"
            echo "BOOTSTRAP_ADMIN_PASSWORD=${admin_password}"
          } > "$RUNNER_TEMP/app.env"
          image="autofix-superadmin:ci-${{ github.run_id }}"
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" "$image" bin/release.sh
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" "$image" bin/release.sh
          docker run -d --name "superadmin-ci-web-${slot}" --network host --env-file "$RUNNER_TEMP/app.env" "$image"
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:${app_port}/healthz/" && break; sleep 1; done
          curl -fsS -o /dev/null "http://localhost:${app_port}/login/"
          echo "SLOT=${slot}" >> "$GITHUB_ENV"
          echo "SMOKE_BASE_URL=http://localhost:${app_port}" >> "$GITHUB_ENV"
      - name: Install Chromium for the smoke test
        run: python -m playwright install chromium
      - name: Browser smoke test (every page at 1440 and 390, no CSP violations, status endpoint)
        run: |
          export SMOKE_EMAIL=ci-admin@example.test
          SMOKE_PASSWORD="$(grep '^BOOTSTRAP_ADMIN_PASSWORD=' "$RUNNER_TEMP/app.env" | cut -d= -f2-)"
          SMOKE_STATUS_TOKEN="$(grep '^AUTOFIX_STATUS_TOKEN=' "$RUNNER_TEMP/app.env" | cut -d= -f2-)"
          export SMOKE_PASSWORD SMOKE_STATUS_TOKEN
          python e2e/smoke.py --screenshots "$RUNNER_TEMP/screenshots"
      - name: Accessibility (axe-core, WCAG 2.2 AA, light and dark, 1440 and 390)
        run: |
          axe="$(find ../node_modules/.pnpm -path '*axe-core@*/node_modules/axe-core/axe.min.js' | sort -V | tail -n 1)"
          test -n "$axe"
          # A signed-in, second-factor-verified session for the CI admin, minted inside the container.
          session="$(docker exec "superadmin-ci-web-${SLOT}" python manage.py shell -c "
          from django.contrib.auth import get_user_model
          from django.contrib.sessions.backends.db import SessionStore
          from django_otp import DEVICE_ID_SESSION_KEY
          from django_otp.plugins.otp_totp.models import TOTPDevice
          user = get_user_model().objects.get(email='ci-admin@example.test')
          device, _ = TOTPDevice.objects.get_or_create(user=user, name='ci-a11y', defaults={'confirmed': True})
          session = SessionStore()
          session.update({'_auth_user_id': str(user.pk), '_auth_user_backend': 'django.contrib.auth.backends.ModelBackend',
                          '_auth_user_hash': user.get_session_auth_hash(), DEVICE_ID_SESSION_KEY: device.persistent_id})
          session.create()
          print(session.session_key)" | tail -n 1)"
          echo "::add-mask::$session"
          python e2e/a11y.py --base "$SMOKE_BASE_URL" --axe "$axe" --session "$session"
      - name: Container logs
        if: always()
        run: docker logs "superadmin-ci-web-${SLOT:-0}" 2>&1 | tail -200 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-smoke-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean up containers and Supabase
        if: always()
        working-directory: .
        run: |
          docker rm -f "superadmin-ci-web-${SLOT:-0}" "superadmin-ci-pg-${SLOT:-0}" >/dev/null 2>&1 || true
          docker image rm "autofix-superadmin:ci-${{ github.run_id }}" >/dev/null 2>&1 || true
          supabase stop --no-backup || true
