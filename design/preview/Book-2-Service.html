      <label style="display: flex; align-items: center; gap: 12px; background: #ffffff; border: 2px solid #155fba; border-radius: 14px; padding: 12px 14px; cursor: pointer">

        </span>
        <span style="font-size: 13px; font-weight: 600; color: #475569">£[price]</span>
      </label>

      </label>

        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 700; font-size: 15px; color: #0f2747">MOT</span>
          <span style="font-size: 12.5px; color: #64748b">Class 4 · 45 min</span>
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #475569">£[price]</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; background: #ffffff; border: 1px solid #e0e7ef; border-radius: 14px; padding: 13px 15px; cursor: pointer">

        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">

          <span style="font-size: 12.5px; color: #64748b">Inspected first, then quoted</span>
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #475569">Quote</span>
      </label>

        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 700; font-size: 15px; color: #0f2747">Something else</span>
          <span style="font-size: 12.5px; color: #64748b">Tell us and we'll quote</span>
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #475569">Quote</span>
      </label>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #e2e8f0; padding: 4px; border-radius: 14px">
        <button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 11px; background: #ffffff; font-family: Inter, sans-serif; font-weight: 700; font-size: 14px; color: #0f2747; box-shadow: 0 1px 3px rgba(7,17,39,0.12)">At the workshop</button>
        <button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 11px; background: transparent; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px; color: #475569">Mobile visit</button>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
