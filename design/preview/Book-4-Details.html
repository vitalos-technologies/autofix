<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book 4 · Details · Pitline design preview</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#155fba}a:hover{color:#1d4ed8}
input::placeholder{color:#7b8796}
</style>

<style>html{background:#d9dee5} body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<!-- Static preview generated from design/screens/Book-4-Details.dc.html. Garage accent shown as default #155fba. Frame 390x844. -->

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f8fafc; font-family: Inter, system-ui, sans-serif; color: #1e293b; overflow: hidden">

  <header style="background: #0f2747; padding: 14px 18px; display: flex; align-items: center; gap: 12px">
    <a href="Book-3-Time.html" aria-label="Back to time" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2a4468; display: flex; align-items: center; justify-content: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="color: #ffffff; font-weight: 700; font-size: 15px">Hartley Road Motors</span>
      <span style="color: #9aa7b6; font-size: 12px">Almost done</span>
    </div>
    <div style="width: 38px; height: 38px; border-radius: 10px; background: #155fba; display: flex; align-items: center; justify-content: center; font-family: Inter, sans-serif; font-weight: 800; font-size: 19px; color: #ffffff">HR</div>
  </header>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">
      <span style="color: #64748b">Step 4 of 5</span>
      <span style="color: #1e293b">Your details</span>
    </div>
    <div style="display: flex; gap: 6px">
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #155fba"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #155fba"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #155fba"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #155fba"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #dfe6ee"></div>
    </div>
  </div>

  <main style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="background: #0f2747; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; color: #ffffff">
      <div style="flex-shrink: 0; background: #f6c700; color: #111111; border-radius: 6px; padding: 4px 8px; font-family: Inter, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.06em">AB12 CDE</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 700; font-size: 14px">Diagnostics · Workshop</span>
        <span style="font-size: 12.5px; color: #94a3b8">Tue 27 Oct · 09:15</span>
      </div>
      <a href="Book-3-Time.html" style="color: #9cc8ff; font-size: 13px; font-weight: 600">Edit</a>
    </div>

    <h1 style="margin: 4px 0 0; font-family: Inter, sans-serif; font-weight: 800; font-size: 34px; line-height: 0.98; color: #0f2747">Who's dropping it off?</h1>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="fullname" style="font-size: 14px; font-weight: 600">Full name</label>
      <input id="fullname" autocomplete="name" value="Sarah Okafor" style="height: 50px; border-radius: 12px; border: 1px solid #cbd5e1; background: #ffffff; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px; color: #0f2747">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mobile" style="font-size: 14px; font-weight: 600">Mobile number</label>
      <input id="mobile" type="tel" autocomplete="tel" placeholder="07700 900000" style="height: 50px; border-radius: 12px; border: 2px solid #155fba; background: #ffffff; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px; color: #0f2747">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 14px; font-weight: 600">Email <span style="font-weight: 400; color: #64748b">(for your receipt)</span></label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 50px; border-radius: 12px; border: 1px solid #cbd5e1; background: #ffffff; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px; color: #0f2747">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Updates by</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="height: 44px; border-radius: 12px; border: 2px solid #155fba; background: #ffffff; color: #155fba; font-family: Inter, sans-serif; font-weight: 700; font-size: 14px">Text</button>
        <button type="button" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px">WhatsApp</button>
        <button type="button" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px">Email</button>
      </div>
    </div>

    <label style="display: flex; gap: 12px; align-items: flex-start; background: #ffffff; border: 1px solid #e0e7ef; border-radius: 14px; padding: 12px 14px; cursor: pointer">
      <input type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; flex-shrink: 0; accent-color: #155fba">
      <span style="font-size: 13.5px; line-height: 1.45; color: #475569">Remind me when the MOT and service are due. You can stop these any time.</span>
    </label>
  </main>

  <div style="margin-top: auto; padding: 12px 20px 24px; background: #ffffff; border-top: 1px solid #e2e8f0">
    <a href="Book-5-Confirmed.html" style="display: flex; height: 54px; border-radius: 14px; background: #155fba; color: #ffffff; font-weight: 700; font-size: 16px; align-items: center; justify-content: center; gap: 8px; text-decoration: none">Confirm booking</a>
    <p style="margin: 8px 0 0; text-align: center; font-size: 11.5px; color: #64748b">Nothing to pay now. <a href="#" style="color: #475569">How we use your details</a></p>
  </div>
</div>

</body>
</html>
