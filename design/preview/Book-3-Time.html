<title>Book 3 · Time · Autofix design preview</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

</style>

<body>
<!-- Static preview generated from design/screens/Book-3-Time.dc.html. Garage accent shown as default #155fba. Frame 390x844. -->

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f7fa; font-family: Inter, system-ui, sans-serif; color: #202a36; overflow: hidden">

  <header style="background: #071127; padding: 14px 18px; display: flex; align-items: center; gap: 12px">
    <a href="Book-2-Service.html" aria-label="Back to service" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #22385f; display: flex; align-items: center; justify-content: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="color: #ffffff; font-weight: 700; font-size: 15px">Hartley Road Motors</span>
      <span style="color: #9aa7b6; font-size: 12px">Diagnostics · 1 hr · Workshop</span>
    </div>
    <div style="width: 38px; height: 38px; border-radius: 10px; background: #155fba; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; color: #ffffff">HR</div>
  </header>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">
      <span style="color: #586575">Step 3 of 5</span>
      <span style="color: #202a36">Time</span>
    </div>
    <div style="display: flex; gap: 6px">
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #155fba"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #155fba"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #155fba"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #dfe6ee"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #dfe6ee"></div>
    </div>
  </div>

  <main style="padding: 20px 0 0; display: flex; flex-direction: column; gap: 16px">
    <div style="padding: 0 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; line-height: 0.98; color: #071127">Pick a time</h1>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #166534; padding-bottom: 4px">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #16a34a"></span>
        Live from the diary
      </span>
    </div>

    <div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 4px">
      <button type="button" style="flex-shrink: 0; width: 58px; height: 72px; border-radius: 14px; border: 1px solid #e0e7ef; background: #ffffff; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #3d4a5a"><span style="font-size: 12px; font-weight: 600">Mon</span><span style="font-size: 20px; font-weight: 700; color: #071127">26</span></button>
      <button type="button" aria-pressed="true" style="flex-shrink: 0; width: 58px; height: 72px; border-radius: 14px; border: 0; background: #071127; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #c9d4e2"><span style="font-size: 12px; font-weight: 600">Tue</span><span style="font-size: 20px; font-weight: 700; color: #ffffff">27</span></button>
      <button type="button" style="flex-shrink: 0; width: 58px; height: 72px; border-radius: 14px; border: 1px solid #e0e7ef; background: #ffffff; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #3d4a5a"><span style="font-size: 12px; font-weight: 600">Wed</span><span style="font-size: 20px; font-weight: 700; color: #071127">28</span></button>
      <button type="button" style="flex-shrink: 0; width: 58px; height: 72px; border-radius: 14px; border: 1px solid #e0e7ef; background: #ffffff; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #3d4a5a"><span style="font-size: 12px; font-weight: 600">Thu</span><span style="font-size: 20px; font-weight: 700; color: #071127">29</span></button>
      <button type="button" style="flex-shrink: 0; width: 58px; height: 72px; border-radius: 14px; border: 1px solid #e0e7ef; background: #ffffff; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #3d4a5a"><span style="font-size: 12px; font-weight: 600">Fri</span><span style="font-size: 20px; font-weight: 700; color: #071127">30</span></button>
      <button type="button" style="flex-shrink: 0; width: 58px; height: 72px; border-radius: 14px; border: 1px solid #e0e7ef; background: #ffffff; font-family: Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #3d4a5a"><span style="font-size: 12px; font-weight: 600">Sat</span><span style="font-size: 20px; font-weight: 700; color: #071127">31</span></button>
    </div>

    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #586575">Morning</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; color: #071127">08:30</button>
        <button type="button" aria-pressed="true" style="height: 48px; border-radius: 12px; border: 2px solid #155fba; background: #155fba; font-family: Inter, sans-serif; font-weight: 700; font-size: 15px; color: #ffffff">09:15</button>
        <button type="button" disabled style="height: 48px; border-radius: 12px; border: 1px dashed #d5dde7; background: transparent; font-family: Inter, sans-serif; font-weight: 500; font-size: 15px; color: #8a96a5; text-decoration: line-through">10:00</button>
        <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; color: #071127">10:45</button>
        <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; color: #071127">11:30</button>
      </div>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #586575; padding-top: 6px">Afternoon</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; color: #071127">13:00</button>
        <button type="button" disabled style="height: 48px; border-radius: 12px; border: 1px dashed #d5dde7; background: transparent; font-family: Inter, sans-serif; font-weight: 500; font-size: 15px; color: #8a96a5; text-decoration: line-through">13:45</button>
        <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; color: #071127">14:30</button>
        <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; color: #071127">15:15</button>
      </div>
    </div>

    <div style="margin: 4px 20px 0; background: #ffffff; border: 1px solid #e0e7ef; border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: flex-start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#586575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
      <span style="font-size: 13.5px; line-height: 1.45; color: #3d4a5a">Drop off at <strong style="color: #071127">09:15</strong>. Expected ready around 10:15. We'll text you when it's done.</span>
    </div>
  </main>

  <div style="margin-top: auto; padding: 14px 20px 26px; background: #ffffff; border-top: 1px solid #e4eaf0">
    <a href="Book-4-Details.html" style="display: flex; height: 54px; border-radius: 14px; background: #155fba; color: #ffffff; font-weight: 700; font-size: 16px; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      Tue 27 Oct, 09:15
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
    </a>
  </div>
