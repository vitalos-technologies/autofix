<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book 4 · Details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#155fba}a:hover{color:#1446a5}
input::placeholder{color:#7b8796}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f7fa; font-family: Inter, system-ui, sans-serif; color: #202a36; overflow: hidden">

  <header style="background: #071127; padding: 14px 18px; display: flex; align-items: center; gap: 12px">
    <a href="Book-3-Time.dc.html" aria-label="Back to time" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #22385f; display: flex; align-items: center; justify-content: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="color: #ffffff; font-weight: 700; font-size: 15px">Hartley Road Motors</span>
      <span style="color: #9aa7b6; font-size: 12px">Almost done</span>
    </div>
    <div style="width: 38px; height: 38px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; color: #ffffff">HR</div>
  </header>

  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">
      <span style="color: #586575">Step 4 of 5</span>
      <span style="color: #202a36">Your details</span>
    </div>
    <div style="display: flex; gap: 6px">
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: {{accent}}"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: {{accent}}"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: {{accent}}"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: {{accent}}"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #dfe6ee"></div>
    </div>
  </div>

  <main style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="background: #071127; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; color: #ffffff">
      <div style="flex-shrink: 0; background: #f6c700; color: #111111; border-radius: 6px; padding: 4px 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.06em">AB12 CDE</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 700; font-size: 14px">Diagnostics · Workshop</span>
        <span style="font-size: 12.5px; color: #b8c4d4">Tue 27 Oct · 09:15</span>
      </div>
      <a href="Book-3-Time.dc.html" style="color: #9cc8ff; font-size: 13px; font-weight: 600">Edit</a>
    </div>

    <h1 style="margin: 4px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 0.98; color: #071127">Who's dropping it off?</h1>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="fullname" style="font-size: 14px; font-weight: 600">Full name</label>
      <input id="fullname" autocomplete="name" value="Sarah Okafor" style="height: 50px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px; color: #071127">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="mobile" style="font-size: 14px; font-weight: 600">Mobile number</label>
      <input id="mobile" type="tel" autocomplete="tel" placeholder="07700 900000" style="height: 50px; border-radius: 12px; border: 2px solid {{accent}}; background: #ffffff; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px; color: #071127">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 14px; font-weight: 600">Email <span style="font-weight: 400; color: #586575">(for your receipt)</span></label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 50px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px; color: #071127">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Updates by</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="height: 44px; border-radius: 12px; border: 2px solid {{accent}}; background: #ffffff; color: {{accent}}; font-family: Inter, sans-serif; font-weight: 700; font-size: 14px">Text</button>
        <button type="button" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; color: #3d4a5a; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px">WhatsApp</button>
        <button type="button" aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #cfd8e3; background: #ffffff; color: #3d4a5a; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px">Email</button>
      </div>
    </div>

    <label style="display: flex; gap: 12px; align-items: flex-start; background: #ffffff; border: 1px solid #e0e7ef; border-radius: 14px; padding: 12px 14px; cursor: pointer">
      <input type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; flex-shrink: 0; accent-color: {{accent}}">
      <span style="font-size: 13.5px; line-height: 1.45; color: #3d4a5a">Remind me when the MOT and service are due. You can stop these any time.</span>
    </label>
  </main>

  <div style="margin-top: auto; padding: 12px 20px 24px; background: #ffffff; border-top: 1px solid #e4eaf0">
    <a href="Book-5-Confirmed.dc.html" style="display: flex; height: 54px; border-radius: 14px; background: {{accent}}; color: #ffffff; font-weight: 700; font-size: 16px; align-items: center; justify-content: center; gap: 8px; text-decoration: none">Confirm booking</a>
    <p style="margin: 8px 0 0; text-align: center; font-size: 11.5px; color: #586575">Nothing to pay now. <a href="#" style="color: #3d4a5a">How we use your details</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#155fba","options":["#155fba","#0f766e","#b9451a","#6d28d9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#155fba' };
  }
}
</script>
</body>
</html>
