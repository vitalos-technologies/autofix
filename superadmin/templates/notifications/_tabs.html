{# Notifications tabs. Context: tab ("all" or "attention"), attention_count (None hides the tab). #}
<nav class="mt-4 flex gap-1 border-b border-slate-200 pb-2 dark:border-slate-800" aria-label="Notification views">
  <a href="{% url 'notifications:list' %}" class="tab" {% if tab == "all" %}aria-current="page"{% endif %}>All notifications</a>
  {% if attention_count is not None %}
    <a href="{% url 'notifications:attention' %}" class="tab inline-flex items-center gap-1.5" {% if tab == "attention" %}aria-current="page"{% endif %} data-testid="attention-tab">
      Needs attention
      {% if attention_count %}<span class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-amber-100 px-1.5 text-[11px] font-semibold text-amber-900 dark:bg-amber-900 dark:text-amber-100">{{ attention_count }}<span class="sr-only"> items</span></span>{% endif %}
    </a>
  {% endif %}
</nav>
