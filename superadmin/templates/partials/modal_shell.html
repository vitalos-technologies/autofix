{% load ui %}
<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/60 p-4 backdrop-blur-sm sm:p-10" data-modal-backdrop>
  <div class="card w-full max-w-xl p-6" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="mb-4 flex items-start justify-between gap-4">
      <h2 id="modal-title" class="text-lg font-semibold">{{ title }}</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-close-modal aria-label="Close">{% icon "x" %}</button>
    </div>
    {% block modal_body %}{% endblock %}
  </div>
</div>
