{% load ui %}<form method="post" action="{{ url }}" hx-post="{{ url }}" hx-swap="none" {% if confirm %}hx-confirm="{{ confirm }}"{% endif %} class="inline">{% csrf_token %}<button type="submit" class="btn btn-sm {{ style|default:'btn-ghost' }}" title="{{ label }}" aria-label="{{ label }}{% if target %} {{ target }}{% endif %}">{% if icon_name %}{% icon icon_name "h-4 w-4" %}{% endif %}{% if show_label %}<span>{{ label }}</span>{% endif %}</button></form>
