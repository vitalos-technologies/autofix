<span class="tabular-nums">{{ seconds }}</span>
<audio controls autoplay preload="none" src="{{ source }}" class="h-10 max-w-full" aria-label="Voicemail from {{ call.created_at|date:'j M H:i' }}" data-testid="voicemail-player">This browser cannot play the voicemail.</audio>
<span class="muted text-xs">Each playback is recorded in the audit trail.</span>
