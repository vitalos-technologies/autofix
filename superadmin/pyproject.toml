[project]
name = "autofix-superadmin"
version = "0.1.0"
description = "Autofix Super Admin: Vitalos staff console over every Autofix garage."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs the local Supabase stack (AUTOFIX_LIVE_* variables); run with -m integration"]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["DJ001", "E501"]  # ruff format owns line length; long literals are allowed

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608"]
# Every unmanaged Autofix model inherits AutofixModel.__str__.
"apps/autofix/models.py" = ["DJ008"]
"e2e/*" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", "e2e", ".venv"]
